[workspace]
members = [
    "crates/achimeld-core",
    "crates/achimeld-security",
    "crates/achimeld-persistence",
    "crates/achimeld-browser",
    "crates/achimeld-app",
    "crates/achimeld-application",
    "crates/achimeld-ui",
    "crates/achimeld-imaging",
    "crates/achimeld-bootstrapper",
    "crates/achimeld-mcp",
]
resolver = "2"
exclude = ["crates/achimeld-ui/third-party/epaint", "crates/achimeld-ui/third-party/egui_glow"]

# Paired source patches: RGB glyph coverage must use per-channel blending.
[patch.crates-io]
epaint = { path = "crates/achimeld-ui/third-party/epaint" }
egui_glow = { path = "crates/achimeld-ui/third-party/egui_glow" }

[workspace.package]
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
skrifa = "=0.44.0"
vello_cpu = { version = "=0.1.0", default-features = false, features = ["std", "u8_pipeline"] }
flate2 = "1"
roxmltree = "0.21"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_System_Memory", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Registry",
] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

