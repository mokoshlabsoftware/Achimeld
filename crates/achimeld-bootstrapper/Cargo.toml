[package]
license.workspace = true
name = "achimeld-bootstrapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[[bin]]
name = "Achimeld"
path = "src/main.rs"

[dependencies]
achimeld-mcp = { path = "../achimeld-mcp" }
achimeld-security = { path = "../achimeld-security" }
base64 = "0.22"
hex = "0.4"
image.workspace = true
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes",
  "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_Networking_WinSock", "Win32_System_Rpc", "Win32_System_IO",
  "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
